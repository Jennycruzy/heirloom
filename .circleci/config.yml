# Runs every Heirloom check on each push: citations, parity, application,
# workflows, screens and syntax. The same command works locally.
version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.11-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: fetch the pinned GenApp source and the first-pass tag
          command: |
            git submodule sync
            git submodule update --init
            git fetch --force --tags origin
      - run:
          name: run every Heirloom check
          command: python3 scripts/verify.py --no-write

workflows:
  verify:
    jobs:
      - verify
